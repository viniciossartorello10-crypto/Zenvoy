<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Voya, the travel mascot">
  <style>
    @keyframes voyaFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes voyaBounce { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-4px) rotate(-2.5deg); } }
    @keyframes voyaBlink { 0%,93%,100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.12); } }
    @keyframes voyaWave  { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
    .vy-fig  { animation: voyaFloat 3.4s ease-in-out infinite; }
    .vy-case { animation: voyaBounce 3.4s ease-in-out infinite; transform-origin: 158px 212px; }
    .vy-eyes { animation: voyaBlink 5s ease-in-out infinite; transform-origin: 85px 72px; }
    .vy-arm  { animation: voyaWave 3.4s ease-in-out infinite; transform-origin: 46px 118px; }
    .vy-navy   { fill: #16213c; }
    .vy-navy2  { fill: #233458; }
    .vy-gold   { fill: #c9a96e; }
    .vy-gold2  { fill: #e3cc92; }
    .vy-skin   { fill: #f2c9a0; }
    .vy-skin-d { fill: #e4b084; }
  </style>

  <!-- ground shadow (static) -->
  <ellipse cx="96" cy="230" rx="66" ry="8" fill="#0b1020" opacity="0.14"/>

  <!-- rolling suitcase (bounces) -->
  <g class="vy-case">
    <!-- telescoping handle -->
    <rect x="131" y="120" width="5" height="60" rx="2.5" class="vy-navy2"/>
    <rect x="168" y="120" width="5" height="60" rx="2.5" class="vy-navy2"/>
    <rect x="131" y="120" width="42" height="7" rx="3.5" class="vy-navy2"/>
    <!-- case body -->
    <rect x="124" y="166" width="56" height="58" rx="10" class="vy-gold"/>
    <rect x="124" y="166" width="56" height="58" rx="10" fill="none" stroke="#16213c" stroke-width="3"/>
    <!-- straps + handle -->
    <rect x="140" y="166" width="5" height="58" class="vy-navy"/>
    <rect x="159" y="166" width="5" height="58" class="vy-navy"/>
    <rect x="144" y="160" width="16" height="9" rx="4" class="vy-navy2"/>
    <!-- travel stickers -->
    <circle cx="134" cy="200" r="5" class="vy-gold2"/>
    <circle cx="170" cy="184" r="4" class="vy-navy2"/>
    <!-- wheels -->
    <circle cx="134" cy="228" r="6" class="vy-navy"/>
    <circle cx="170" cy="228" r="6" class="vy-navy"/>
  </g>

  <!-- the girl (gently floats) -->
  <g class="vy-fig">
    <!-- legs -->
    <rect x="74" y="176" width="13" height="34" rx="6" class="vy-skin"/>
    <rect x="96" y="176" width="13" height="34" rx="6" class="vy-skin"/>
    <!-- shoes -->
    <path d="M70 208 q-3 10 8 10 h12 v-10 z" class="vy-gold"/>
    <path d="M92 208 q-3 10 8 10 h12 v-10 z" class="vy-gold"/>

    <!-- dress (navy with gold trim) -->
    <path d="M60 118 q31 -14 62 0 l14 66 q-45 16 -90 0 z" class="vy-navy"/>
    <path d="M60 118 q31 -14 62 0 l3 14 q-34 -12 -68 0 z" class="vy-gold"/>
    <rect x="52" y="178" width="78" height="8" rx="4" class="vy-gold2"/>

    <!-- near arm holding the suitcase handle -->
    <path d="M118 120 q22 6 20 44" fill="none" stroke="#f2c9a0" stroke-width="12" stroke-linecap="round"/>
    <circle cx="137" cy="162" r="7" class="vy-skin-d"/>

    <!-- far arm (waves) -->
    <g class="vy-arm">
      <path d="M64 120 q-18 2 -22 -14" fill="none" stroke="#f2c9a0" stroke-width="12" stroke-linecap="round"/>
      <circle cx="42" cy="104" r="7" class="vy-skin"/>
    </g>

    <!-- neck -->
    <rect x="80" y="92" width="16" height="16" rx="6" class="vy-skin"/>

    <!-- hair back -->
    <circle cx="88" cy="60" r="40" class="vy-navy"/>
    <!-- ponytail -->
    <path d="M124 54 q22 6 16 34 q-12 10 -20 -2 q6 -16 -2 -30 z" class="vy-navy2"/>

    <!-- face -->
    <circle cx="88" cy="64" r="33" class="vy-skin"/>
    <!-- hair fringe -->
    <path d="M55 60 q4 -34 36 -36 q30 0 35 30 q-16 -16 -36 -14 q-22 2 -35 20 z" class="vy-navy"/>
    <!-- gold hair clip -->
    <circle cx="116" cy="46" r="5" class="vy-gold2"/>

    <!-- cheeks -->
    <circle cx="70" cy="76" r="6" fill="#f0a3a0" opacity="0.65"/>
    <circle cx="104" cy="76" r="6" fill="#f0a3a0" opacity="0.65"/>

    <!-- eyes (blink) -->
    <g class="vy-eyes">
      <ellipse cx="76" cy="66" rx="6.5" ry="8.5" fill="#fff"/>
      <ellipse cx="100" cy="66" rx="6.5" ry="8.5" fill="#fff"/>
      <circle cx="77" cy="68" r="4.2" class="vy-navy"/>
      <circle cx="101" cy="68" r="4.2" class="vy-navy"/>
      <circle cx="78.5" cy="66" r="1.6" fill="#fff"/>
      <circle cx="102.5" cy="66" r="1.6" fill="#fff"/>
    </g>
    <!-- eyebrows -->
    <path d="M70 54 q6 -3 12 0" fill="none" stroke="#16213c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M94 54 q6 -3 12 0" fill="none" stroke="#16213c" stroke-width="2.4" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M80 82 q8 8 16 0" fill="none" stroke="#16213c" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
